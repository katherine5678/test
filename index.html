<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>待辦看板</title>
  <script>
    // 在畫面繪製前套用主題，避免閃爍
    try {
      const saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>待辦看板</h1>
      <p class="subtitle" id="summary"></p>
    </div>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="切換深色模式">
      <span class="icon-moon" aria-hidden="true">🌙</span>
      <span class="icon-sun" aria-hidden="true">☀️</span>
      <span id="theme-label"></span>
    </button>
  </header>

  <main class="board" id="board"></main>

  <p class="hint">拖曳卡片即可移動 · 雙擊文字編輯 · 資料儲存在瀏覽器中</p>

  <template id="column-template">
    <section class="column">
      <header class="column-head">
        <span class="dot"></span>
        <h2></h2>
        <span class="badge"></span>
        <button type="button" class="clear link" hidden>清除</button>
      </header>
      <ul class="cards"></ul>
      <form class="add-form" autocomplete="off">
        <input type="text" maxlength="200" placeholder="＋ 新增卡片">
      </form>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
