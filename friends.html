<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>朋友喜好</title>
  <script>
    // 在畫面繪製前套用主題，避免閃爍
    try {
      const saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch {}
  </script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="friends.css">
</head>
<body>
  <header class="topbar">
    <div class="heading">
      <nav class="page-switch" aria-label="切換頁面">
        <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 7v7"/><path d="M12 7v4"/><path d="M16 7v9"/></svg>看板</a>
        <a href="stocks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 7 13.5 15.5 8.5 10.5 2 17"/><path d="M16 7h6v6"/></svg>股票</a>
        <a href="diary.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>日記</a>
        <a href="friends.html" class="active" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>朋友</a>
      </nav>
      <h1>朋友喜好</h1>
      <p class="subtitle" id="friends-stats"></p>
    </div>
    <div class="top-actions">
      <button type="button" id="group-delete" class="icon-btn" hidden></button>
      <button type="button" id="export-btn" class="icon-btn" title="匯出備份（JSON 檔）" aria-label="匯出備份"></button>
      <button type="button" id="import-btn" class="icon-btn" title="匯入備份（JSON 檔）" aria-label="匯入備份"></button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="切換深色模式">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <span id="theme-label"></span>
      </button>
    </div>
  </header>

  <div class="toolbar">
    <nav class="projects" id="groups" aria-label="朋友分類"></nav>
    <div class="friends-tools">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="search" placeholder="搜尋名字、喜好…" aria-label="搜尋朋友" autocomplete="off">
      </label>
      <button type="button" class="btn primary" id="add-friend">＋ 新增朋友</button>
    </div>
  </div>

  <main class="friends" id="friends"></main>

  <dialog id="friend-dialog" class="dialog" aria-labelledby="friend-dialog-title">
    <form id="friend-form" method="dialog" autocomplete="off">
      <header class="dialog-head">
        <h2 id="friend-dialog-title">新增朋友</h2>
        <button type="button" class="icon-btn" id="friend-close" title="關閉" aria-label="關閉"></button>
      </header>

      <div class="field-row">
        <label class="field">
          <span>本名</span>
          <input type="text" id="field-name" maxlength="60">
        </label>
        <label class="field">
          <span>暱稱</span>
          <input type="text" id="field-nickname" maxlength="60">
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span>分類</span>
          <select id="field-group"></select>
        </label>
        <label class="field">
          <span>血型</span>
          <select id="field-blood">
            <option value="">不知道</option>
            <option value="A">A 型</option>
            <option value="B">B 型</option>
            <option value="O">O 型</option>
            <option value="AB">AB 型</option>
          </select>
        </label>
      </div>

      <div class="field-row">
        <div class="field">
          <span>生日</span>
          <div class="birthday" role="group" aria-label="生日">
            <input type="number" id="field-birth-year" min="1900" max="2100" placeholder="年（可不填）" aria-label="出生年">
            <select id="field-birth-month" aria-label="生日月份"></select>
            <select id="field-birth-day" aria-label="生日日期"></select>
          </div>
        </div>
        <div class="field zodiac-field">
          <span>星座</span>
          <output id="field-zodiac" for="field-birth-month field-birth-day">—</output>
        </div>
      </div>

      <div class="field-row">
        <label class="field">
          <span>工作</span>
          <input type="text" id="field-job" maxlength="100">
        </label>
        <label class="field">
          <span>政治色彩</span>
          <input type="text" id="field-politics" maxlength="60" placeholder="例如：偏藍、偏綠、中立、不談政治">
        </label>
      </div>

      <label class="field">
        <span>興趣（用頓號分隔）</span>
        <input type="text" id="field-hobbies" maxlength="300" placeholder="爬山、攝影、追劇">
      </label>

      <div class="field-row">
        <label class="field">
          <span>喜歡（一行一項）</span>
          <textarea id="field-likes" rows="4" placeholder="珍珠奶茶&#10;貓&#10;周杰倫"></textarea>
        </label>
        <label class="field">
          <span>不喜歡（一行一項）</span>
          <textarea id="field-dislikes" rows="4" placeholder="香菜&#10;太甜的東西"></textarea>
        </label>
      </div>

      <label class="field">
        <span>備註</span>
        <textarea id="field-notes" rows="3" placeholder="過敏、送過的禮物、家人…"></textarea>
      </label>

      <footer class="dialog-foot">
        <button type="button" class="icon-btn" id="friend-delete" title="刪除朋友" aria-label="刪除朋友"></button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="friend-cancel">取消</button>
        <button type="submit" class="btn primary">儲存</button>
      </footer>
    </form>
  </dialog>

  <script src="friends.js"></script>
</body>
</html>
