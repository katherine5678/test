<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日記</title>
  <script>
    // 在畫面繪製前套用主題，避免閃爍
    try {
      const saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch {}
  </script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="diary.css">
</head>
<body>
  <header class="topbar">
    <div class="heading">
      <nav class="page-switch" aria-label="切換頁面">
        <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 7v7"/><path d="M12 7v4"/><path d="M16 7v9"/></svg>看板</a>
        <a href="stocks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 7 13.5 15.5 8.5 10.5 2 17"/><path d="M16 7h6v6"/></svg>股票</a>
        <a href="diary.html" class="active" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>日記</a>
        <a href="friends.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>朋友</a>
      </nav>
      <h1>日記</h1>
      <p class="subtitle" id="diary-stats"></p>
    </div>
    <div class="top-actions">
      <button type="button" id="export-btn" class="icon-btn" title="匯出備份（JSON 檔）" aria-label="匯出備份"></button>
      <button type="button" id="import-btn" class="icon-btn" title="匯入備份（JSON 檔）" aria-label="匯入備份"></button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="切換深色模式">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <span id="theme-label"></span>
      </button>
    </div>
  </header>

  <main class="diary">
    <section class="diary-panel calendar" aria-label="月曆">
      <header class="calendar-head">
        <button type="button" class="icon-btn" id="month-prev" title="上個月" aria-label="上個月"></button>
        <h2 id="month-label"></h2>
        <button type="button" class="icon-btn" id="month-next" title="下個月" aria-label="下個月"></button>
        <button type="button" class="btn today-btn" id="today-btn">今天</button>
      </header>
      <div class="weekdays" aria-hidden="true">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="days" id="days"></div>
    </section>

    <section class="diary-panel editor" aria-labelledby="entry-date">
      <header class="editor-head">
        <div>
          <h2 id="entry-date"></h2>
          <span class="entry-relative" id="entry-relative"></span>
        </div>
        <button type="button" class="icon-btn" id="entry-delete" title="刪除這篇日記" aria-label="刪除這篇日記"></button>
      </header>
      <div class="moods" id="moods" role="group" aria-label="今天的心情"></div>
      <input type="text" id="entry-title" maxlength="100" placeholder="標題" aria-label="標題" autocomplete="off">
      <textarea id="entry-text" placeholder="今天發生了什麼？" aria-label="日記內容"></textarea>
      <footer class="editor-foot">
        <span id="entry-count"></span>
        <span id="entry-status" role="status"></span>
      </footer>
    </section>

    <section class="diary-panel entries" aria-labelledby="list-label">
      <h2 id="list-label"></h2>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="search" placeholder="搜尋所有日記…" aria-label="搜尋日記" autocomplete="off">
      </label>
      <ul class="entry-list" id="entry-list"></ul>
    </section>
  </main>

  <script src="diary.js"></script>
</body>
</html>
